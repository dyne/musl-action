name: setup-musl-toolchain
description: Set up a verified Dyne musl release for static cross-compilation

inputs:
  target_arch:
    description: Target architecture (x86_64, arm_64, arm_hf, riscv_64)
    required: false
    default: x86_64
  version:
    description: Exact dyne/musl release tag, or latest
    required: false
    default: latest
  sha256:
    description: Optional expected archive SHA-256, in addition to the release manifest
    required: false
    default: ''
  token:
    description: GitHub token used only for release API requests
    required: false
    default: ${{ github.token }}
outputs:
  CC:
    description: Path to the C compiler
    value: ${{ steps.install.outputs.CC }}
  CXX:
    description: Path to the C++ compiler
    value: ${{ steps.install.outputs.CXX }}
  version:
    description: Resolved dyne/musl release tag
    value: ${{ steps.resolve.outputs.version }}
  sha256:
    description: Verified archive SHA-256
    value: ${{ steps.resolve.outputs.sha256 }}
  cache-hit:
    description: Whether the exact archive cache was restored
    value: ${{ steps.cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Resolve release and checksum
      id: resolve
      shell: bash
      env:
        MUSL_TARGET: ${{ inputs.target_arch }}
        MUSL_VERSION: ${{ inputs.version }}
        MUSL_SHA256: ${{ inputs.sha256 }}
        MUSL_TOKEN: ${{ inputs.token }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/install.py" resolve
    - name: Restore release archive
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.resolve.outputs.cache_dir }}
        key: ${{ steps.resolve.outputs.cache_key }}
    - name: Verify and install toolchain
      id: install
      shell: bash
      env:
        MUSL_PLAN: ${{ steps.resolve.outputs.plan }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/install.py" install --plan "$MUSL_PLAN"
    - name: Save verified archive
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.resolve.outputs.cache_dir }}
        key: ${{ steps.resolve.outputs.cache_key }}
